# ============================================================================
# File: falcon_mode.cfg
# Mục đích: Cấu hình Kconfig fragment kích hoạt U-Boot Falcon Mode trên AM335x
# Tham chiếu: Boot Time Optimization & U-Boot Falcon Mode Seminar (Bootlin)
# Cách dùng: Ghép vào configs/am335x_evm_defconfig hoặc dùng trong Yocto recipe
# ============================================================================

# 1. Bật tính năng cho phép SPL nạp trực tiếp hệ điều hành (Linux Kernel)
CONFIG_SPL_OS_BOOT=y

# 2. Cho phép lệnh "spl export" trong U-Boot CLI để tạo file DTB đã gắn sẵn bootargs
CONFIG_CMD_SPL=y
CONFIG_CMD_SPL_WRITE_SIZE=0x20000

# 3. Cho phép ghi file từ RAM xuống phân vùng FAT32 của thẻ nhớ SD (lệnh fatwrite)
CONFIG_FAT_WRITE=y

# 4. Cấu hình tên file Kernel và tên file DTB đã chuẩn bị trên phân vùng FAT32
CONFIG_SPL_FS_LOAD_PAYLOAD_NAME="u-boot.img"
CONFIG_SPL_FS_LOAD_KERNEL_NAME="zImage"
CONFIG_SPL_FS_LOAD_ARGS_NAME="args"

# 5. Địa chỉ RAM nơi SPL sẽ nạp file "args" (Device Tree đã nhúng bootargs)
CONFIG_SYS_SPL_ARGS_ADDR=0x88000000

# 6. Tắt thời gian chờ bootdelay nếu rơi vào U-Boot fallback
CONFIG_BOOTDELAY=0
